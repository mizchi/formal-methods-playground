\* T5 green check: a healthy day's log, replayed against the level we claim to
\* run at. Every line is admitted and the seat limit held. Nothing to report --
\* which is what a conformance check says on almost every day it runs.
SPECIFICATION Spec
CONSTANTS
  Txns = {"t1", "t2"}
  SeatLimit = 1
  Isolation = "SERIALIZABLE"
  Trace <- HealthyLog
INVARIANT TypeOK
INVARIANT SeatsWithinLimit
PROPERTY TraceAccepted
CHECK_DEADLOCK FALSE
