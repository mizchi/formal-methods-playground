\* Breaking variant (liveness): reserve-first plus "409 while reserved" is
\* safe -- and wedges. After a crash the row stays "reserved" and no retry may
\* resume it. Running this SHOULD report EventuallySettled violated while
\* NoDoubleCharge still holds.
SPECIFICATION Spec
CONSTANTS
  MaxCrashes = 1
  ReserveFirst = TRUE
  ProviderIdempotent = FALSE
  TakeoverReserved = FALSE
INVARIANT TypeOK
INVARIANT NoDoubleCharge
PROPERTY EventuallySettled
CHECK_DEADLOCK FALSE
