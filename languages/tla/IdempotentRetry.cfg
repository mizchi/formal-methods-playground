\* Correct design: reserve the key first, resume a half-written row on retry,
\* and rely on the provider deduping the same key. Safety and liveness both hold.
SPECIFICATION Spec
CONSTANTS
  MaxCrashes = 2
  ReserveFirst = TRUE
  ProviderIdempotent = TRUE
  TakeoverReserved = TRUE
INVARIANT TypeOK
INVARIANT NoDoubleCharge
PROPERTY EventuallySettled
CHECK_DEADLOCK FALSE
