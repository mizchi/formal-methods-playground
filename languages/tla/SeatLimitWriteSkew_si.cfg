\* Breaking variant: plain Snapshot Isolation (REPEATABLE READ). The two
\* inserts touch different rows, so nothing conflicts and both commit.
\* Running this SHOULD report SeatsWithinLimit violated (members = SeatLimit+1).
SPECIFICATION Spec
CONSTANTS
  Txns = {t1, t2}
  SeatLimit = 1
  Isolation = "SI"
INVARIANT TypeOK
INVARIANT SeatsWithinLimit
CHECK_DEADLOCK FALSE
