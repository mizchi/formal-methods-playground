\* The fix teams usually ship: SELECT ... FOR UPDATE the org row, then read the
\* count with a fresh snapshot (PostgreSQL READ COMMITTED). The two requests
\* serialise on an explicit lock.
SPECIFICATION Spec
CONSTANTS
  Txns = {t1, t2}
  SeatLimit = 1
  Isolation = "SI_LOCK"
INVARIANT TypeOK
INVARIANT SeatsWithinLimit
CHECK_DEADLOCK FALSE
