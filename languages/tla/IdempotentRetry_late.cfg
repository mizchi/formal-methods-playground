\* Breaking variant (safety): the idempotency row is written only AFTER the
\* provider call. A crash in that window leaves rec = "none", so the retry
\* charges again. Running this SHOULD report NoDoubleCharge violated.
SPECIFICATION Spec
CONSTANTS
  MaxCrashes = 1
  ReserveFirst = FALSE
  ProviderIdempotent = FALSE
  TakeoverReserved = TRUE
INVARIANT TypeOK
INVARIANT NoDoubleCharge
CHECK_DEADLOCK FALSE
