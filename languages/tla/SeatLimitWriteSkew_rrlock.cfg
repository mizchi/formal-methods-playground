\* Breaking variant: PostgreSQL REPEATABLE READ + SELECT ... FOR UPDATE.
\* The snapshot is taken before the locking statement waits, so the second
\* request still reads the stale count after the lock is granted.
\* Running this SHOULD report SeatsWithinLimit violated (members = SeatLimit+1).
SPECIFICATION Spec
CONSTANTS
  Txns = {t1, t2}
  SeatLimit = 1
  Isolation = "RR_LOCK"
INVARIANT TypeOK
INVARIANT SeatsWithinLimit
CHECK_DEADLOCK FALSE
