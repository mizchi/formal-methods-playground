\* T5 green check, second one on purpose: the same two-admin overlap as the
\* incident, but on a pool that really is SERIALIZABLE. The log records the
\* second COMMIT coming back 40001 and rolling back, which only SSI admits, so
\* this run is evidence *for* the isolation level -- not just absence of
\* evidence against it. Green here and green in SeatLimitTrace.cfg for
\* different reasons: one log never contends, this one contends and loses.
SPECIFICATION Spec
CONSTANTS
  Txns = {"t1", "t2"}
  SeatLimit = 1
  Isolation = "SERIALIZABLE"
  Trace <- RetriedLog
INVARIANT TypeOK
INVARIANT SeatsWithinLimit
PROPERTY TraceAccepted
CHECK_DEADLOCK FALSE
